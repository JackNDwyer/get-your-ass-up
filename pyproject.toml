[project]
name = "get-your-ass-up"
version = "0.1.0"
description = "A snarky voice coach that makes you work out while Claude Code works."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "livekit-agents~=1.8",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
